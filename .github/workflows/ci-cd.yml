name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: iqc-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

env:
  SUPABASE_PROJECT_REF: mobroigpqtsfbfbvmvwa
  SUPABASE_POOLER_HOST: aws-0-ap-northeast-1.pooler.supabase.com
  SUPABASE_POOLER_PORT: "6543"
  BACKEND_URL: https://iqc-api-amaccaodev.onrender.com

jobs:
  validate:
    name: Build frontend + backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Typecheck frontend
        run: pnpm exec tsc --noEmit

      - name: Typecheck backend
        run: pnpm --dir backend typecheck

      - name: Build frontend
        run: pnpm build

      - name: Build backend
        working-directory: backend
        run: npm run build

  migrate-db:
    name: Database migrate
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install backend dependencies (pg)
        working-directory: backend
        run: npm ci

      - name: Run pending SQL migrations
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: node backend/scripts/migrate_pg.mjs

  deploy-backend:
    name: Trigger Render backend deploy
    needs: migrate-db
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: Deploy backend on Render
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -n "$HOOK" ]; then
            curl -fsS -X POST "$HOOK"
          else
            echo "RENDER_DEPLOY_HOOK chưa set — bỏ qua (Render vẫn auto-deploy nếu đã connect GitHub)"
          fi

  deploy-pages:
    name: Deploy GitHub Pages
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend for GitHub Pages (demo UI, no backend)
        env:
          GITHUB_PAGES: "true"
          VITE_DEMO_MODE: "true"
        run: pnpm build

      - name: SPA fallback for GitHub Pages
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

      - id: deployment
        uses: actions/deploy-pages@v4
