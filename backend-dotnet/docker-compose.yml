services:
  mysql:
    image: mysql:8.0
    container_name: iqc-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: iqc
      MYSQL_USER: iqc
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-iqc}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uiqc", "-piqc"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: iqc-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iqc-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-3001}:3001"
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      PORT: 3001
      Database__AutoMigrate: "true"
      ConnectionStrings__DefaultConnection: "Server=mysql;Port=3306;Database=iqc;User=iqc;Password=${MYSQL_PASSWORD:-iqc};"
      ConnectionStrings__Redis: "redis:6379"
      Jwt__Secret: ${JWT_SECRET:-iqc-dev-secret-change-in-production-min-32-chars!!}
      Cors__Origins__0: "http://localhost:8443"
      Cors__Origins__1: "http://localhost:5173"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mysql_data:
  redis_data:
