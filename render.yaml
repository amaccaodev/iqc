services:
  # Backend API (Docker)
  - type: web
    name: iqc-api-amaccaodev
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CORS_ORIGIN
        value: https://iqc-frontend.onrender.com

  # Frontend static — DEMO UI (mock in-memory, không cần API)
  - type: web
    name: iqc-frontend
    runtime: static
    plan: free
    buildCommand: npm install -g pnpm@10 && pnpm install --frozen-lockfile && VITE_DEMO_MODE=true pnpm build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
